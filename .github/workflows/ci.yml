name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firestore:
    name: Firestore repository and migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - name: Test against an isolated emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18085
        run: |
          gcloud emulators firestore start --host-port="$FIRESTORE_EMULATOR_HOST" --quiet > /tmp/firestore.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid"' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://$FIRESTORE_EMULATOR_HOST/" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/firestore.log; exit 1; fi
          mvn -B -f backend/pom.xml package -DskipTests
          node scripts/test-migration.mjs
          mvn -B -f backend/pom.xml test -Pfirestore-tests

  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        # Live-network integration tests are excluded by default (see pom.xml).
        run: mvn -B test

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency audit report
        continue-on-error: true
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Packaged production-asset E2E tests
        run: npm run test:e2e
